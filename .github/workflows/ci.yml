name: CI
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-tree: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: clientops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          DATABASE_URL: postgresql://admin:admin@localhost:5432/clientops?schema=public
          PORT: 4000
        steps:
          - uses: actions/checkout@v4
            uses: actions/setup-node@v4
            with:
              node-version: 22
              cache: npm
              cache-dependency-path: services/api/package-lock.json
          - run: npm ci
          - run: npx prisma generate
          - run: npm run lint
          - run: npx tsc --noEmit
          - run: npm test
          - run: npm run test:e2e
          - npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-tree: services/web
    steps:
      - uses: actions/checkout@v4
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - npm run build